<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>套房 · 3D 场景（参考 套房.skp 重建）</title>
<style>
  :root{
    --ink:#1d1f22; --ink-2:#5b6167; --line:rgba(20,22,25,.10);
    --panel:rgba(252,251,249,.86); --accent:#8a6a45;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#d9d6d1;
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--ink)}
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* ---------- 面板 ---------- */
  .panel{position:fixed;top:18px;left:18px;width:246px;padding:16px 16px 14px;
    background:var(--panel);backdrop-filter:blur(14px) saturate(1.1);
    border:1px solid var(--line);border-radius:14px;
    box-shadow:0 18px 40px -24px rgba(20,22,25,.45), 0 2px 6px rgba(20,22,25,.06);
    user-select:none}
  .panel h1{margin:0 0 2px;font-size:15px;font-weight:600;letter-spacing:.02em}
  .panel .sub{font-size:11px;color:var(--ink-2);line-height:1.5;margin-bottom:12px}
  .block{margin-top:12px}
  .block .cap{font-size:10.5px;letter-spacing:.14em;color:var(--ink-2);text-transform:uppercase;margin-bottom:7px}
  .views{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  button{font:inherit;font-size:12px;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:9px;padding:7px 8px;cursor:pointer;
    transition:background .18s,border-color .18s,transform .18s}
  button:hover{background:#f4f1ec;border-color:rgba(20,22,25,.18)}
  button:active{transform:translateY(1px)}
  button.on{background:#1d1f22;color:#fbfaf8;border-color:#1d1f22}
  .rows{display:flex;flex-direction:column;gap:7px}
  .row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink)}
  .sw{position:relative;width:34px;height:19px;border-radius:999px;background:#d8d3cb;border:none;padding:0;cursor:pointer;flex:0 0 auto}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
  .sw.on{background:var(--accent)}
  .sw.on::after{transform:translateX(15px)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:104px;height:3px;border-radius:2px;background:#d8d3cb;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:#fff;border:1px solid rgba(20,22,25,.25);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer}
  .hint{margin-top:13px;padding-top:11px;border-top:1px solid var(--line);
    font-size:10.5px;line-height:1.65;color:var(--ink-2)}
  .hint b{color:var(--ink);font-weight:600}

  /* ---------- 图例 ---------- */
  .legend{position:fixed;right:18px;bottom:16px;text-align:right;font-size:10.5px;color:#4a4f54;
    line-height:1.6;text-shadow:0 1px 0 rgba(255,255,255,.5)}
  .legend b{font-weight:600;color:#2a2d30}

  /* ---------- 载入 ---------- */
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#dedbd6;z-index:9;transition:opacity .6s;font-size:12px;color:var(--ink-2);letter-spacing:.1em}
  #boot.off{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>

<div class="panel">
  <h1>套房 · 3D 场景</h1>
  <div class="sub">参考 <code>套房.skp</code> 的空间关系重建<br>三卧 · 两卫 · 书房 · 起居</div>

  <div class="block">
    <div class="cap">视角</div>
    <div class="views" id="views"></div>
  </div>

  <div class="block">
    <div class="cap">显示</div>
    <div class="rows">
      <div class="row"><span>房间标注</span><button class="sw on" data-t="labels"></button></div>
      <div class="row"><span>家具</span><button class="sw on" data-t="furniture"></button></div>
      <div class="row"><span>角线 / 网格</span><button class="sw" data-t="grid"></button></div>
      <div class="row"><span>自动旋转</span><button class="sw" data-t="auto"></button></div>
    </div>
  </div>

  <div class="block">
    <div class="cap">剖切高度 <span id="cutv" style="color:var(--ink);letter-spacing:0">2.85 m</span></div>
    <input type="range" id="cut" min="0.35" max="2.85" step="0.01" value="2.85" style="width:100%" />
  </div>

  <div class="block">
    <div class="cap">模型</div>
    <div class="views" id="models"></div>
  </div>

  <div class="block">
    <div class="cap">光照</div>
    <div class="views" id="lights"></div>
  </div>

  <div class="hint">
    <b>左键</b> 旋转 · <b>滚轮</b> 缩放 · <b>右键</b> 平移<br>
    <b>W A S D</b> 漫游 · <b>Q E</b> 升降 · 按 <b>Esc</b> 退出漫游
  </div>
</div>

<div class="legend">
  <b>套房 3D 场景</b><br>
  <span id="legendInfo">程序化材质与光照 · 单位：米 · 参考 套房.skp 重建</span><br>
  依据 套房.skp 的平面与家具布置重建
</div>

<div id="boot">正在构建场景 …</div>

<!-- 1:1 原始模型（由 套房.skp 导出的 glb，base64 内嵌；文件不存在时本行 404 也不影响其它功能） -->
<script src="assets/suite-model.js" onerror="window.__SUITE_MODEL_MISSING=true"></script>
<script src="vendor/three.min.js"></script>
<script>
/* =========================================================================
   套房 3D 场景 —— 参考 套房.skp（SketchUp 2022 模型）重建
   -------------------------------------------------------------------------
   平面还原（米，X 向东，Z 向南，Y 向上）：
     北侧一排：卧室A | 卫A | 卫B | 卧室B
     中部：西侧卫生间 + 走廊，东侧起居／餐区
     南侧：卧室C | 书房 | 起居延伸（电视墙、大窗）
   全部材质由 canvas 程序化生成，无外部贴图依赖。
   ========================================================================= */
(function () {
  'use strict';
  const T = THREE;

  /* ------------------------------------------------------------------ 参数 */
  const W = 13.4, D = 10.6;          // 外轮廓
  const WH = 2.85;                   // 层高
  const EXT = 0.24, INT = 0.15;      // 外墙 / 内墙厚
  const OX = -W / 2, OZ = -D / 2;    // 世界原点：平面中心

  const P = (x, z) => new T.Vector3(x + OX, 0, z + OZ);   // 平面坐标 → 世界
  const room = (x1, z1, x2, z2) => ({ x1, z1, x2, z2, cx: (x1 + x2) / 2, cz: (z1 + z2) / 2 });

  const ROOMS = {
    bedA:    room(0.00, 0.00,  4.60,  4.30),   // 西侧卧室（主卧）
    bathA:   room(4.60, 0.00,  7.00,  3.00),   // 卫 A（淋浴）
    bathB:   room(7.00, 0.00,  9.30,  3.00),   // 卫 B
    hallN:   room(4.60, 3.00,  9.30,  4.30),   // 北走廊
    bedB:    room(9.30, 0.00, 13.40,  4.30),   // 东北卧室
    wcC:     room(0.00, 4.30,  2.30,  6.90),   // 独立卫生间
    hallW:   room(2.30, 4.30,  4.80,  6.90),   // 西走廊 / 玄关
    bedC:    room(0.00, 6.90,  4.80, 10.60),   // 西南卧室
    study:   room(4.80, 6.90,  7.60, 10.60),   // 书房
    living:  room(4.80, 4.30, 13.40, 10.60)    // 起居 + 餐区（L 形）
  };

  /* ------------------------------------------------------------ 渲染器/场景 */
  const app = document.getElementById('app');
  let renderer;
  try {
    renderer = new T.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
  } catch (e) {
    document.getElementById('boot').innerHTML =
      '<div style="max-width:520px;text-align:center;line-height:1.9">' +
      '<b>浏览器没有启用 WebGL，3D 场景无法渲染</b><br>' +
      '① 换用 Chrome / Edge 打开；② 打开浏览器设置里的「使用硬件加速」后重启浏览器；' +
      '③ 若在虚拟机或远程桌面里，需开启显卡直通。<br><span style="color:#8a8f95;font-size:11px">' +
      String((e && e.message) || e) + '</span></div>';
    throw e;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.06;
  renderer.outputColorSpace = T.SRGBColorSpace;
  app.appendChild(renderer.domElement);

  const scene = new T.Scene();
  scene.background = new T.Color(0xd9d6d1);

  const camera = new T.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 400);

  /* --------------------------------------------------------- 程序化贴图工厂 */
  function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function tex(canvas, rx, ry, srgb) {
    const t = new T.CanvasTexture(canvas);
    t.wrapS = t.wrapT = T.RepeatWrapping;
    t.repeat.set(rx || 1, ry || 1);
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    if (srgb !== false) t.colorSpace = T.SRGBColorSpace;
    return t;
  }
  function noise(ctx, w, h, amt, alpha) {
    const img = ctx.getImageData(0, 0, w, h), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * amt;
      d[i] += n; d[i + 1] += n; d[i + 2] += n;
      if (alpha !== undefined) d[i + 3] = alpha;
    }
    ctx.putImageData(img, 0, 0);
  }
  // 木地板：浅橡木，竖向直纹 + 板缝
  function woodCanvas() {
    const w = 1024, h = 1024, c = cv(w, h), x = c.getContext('2d');
    x.fillStyle = '#b98a5e'; x.fillRect(0, 0, w, h);
    const planks = 8, pw = w / planks;
    for (let i = 0; i < planks; i++) {
      const base = 176 + Math.random() * 26;
      x.fillStyle = `rgb(${base + 14},${base - 24},${base - 62})`;
      x.fillRect(i * pw, 0, pw - 1.5, h);
      for (let g = 0; g < 150; g++) {                       // 木纹
        x.strokeStyle = `rgba(${90 + Math.random() * 70},${54 + Math.random() * 40},${24 + Math.random() * 30},${0.03 + Math.random() * 0.09})`;
        x.lineWidth = 0.6 + Math.random() * 1.7;
        const gx = i * pw + Math.random() * pw;
        x.beginPath(); x.moveTo(gx, 0);
        x.bezierCurveTo(gx + (Math.random() - .5) * 9, h * .33, gx + (Math.random() - .5) * 9, h * .66, gx + (Math.random() - .5) * 5, h);
        x.stroke();
      }
      x.fillStyle = 'rgba(60,38,20,.30)'; x.fillRect(i * pw + pw - 1.6, 0, 1.6, h);
    }
    // 板端缝
    for (let i = 0; i < 26; i++) {
      x.fillStyle = 'rgba(60,38,20,.22)';
      x.fillRect(Math.floor(Math.random() * planks) * pw, Math.random() * h, pw, 1.4);
    }
    noise(x, w, h, 10);
    return c;
  }
  // 石材／水泥地毯：米灰底 + 淡纹
  function stoneCanvas() {
    const w = 1024, h = 1024, c = cv(w, h), x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#d8cfc2'); g.addColorStop(.5, '#cfc5b6'); g.addColorStop(1, '#dcd4c8');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 60; i++) {                            // 石纹
      x.strokeStyle = `rgba(150,138,122,${0.05 + Math.random() * 0.13})`;
      x.lineWidth = 1 + Math.random() * 4;
      x.beginPath();
      let px = Math.random() * w, py = Math.random() * h;
      x.moveTo(px, py);
      for (let s = 0; s < 5; s++) { px += (Math.random() - .5) * 320; py += (Math.random() - .5) * 320; x.lineTo(px, py); }
      x.stroke();
    }
    for (let i = 0; i < 900; i++) {                           // 斑点
      x.fillStyle = `rgba(${120 + Math.random() * 90},${112 + Math.random() * 84},${100 + Math.random() * 76},${0.05 + Math.random() * .12})`;
      x.beginPath(); x.arc(Math.random() * w, Math.random() * h, 1 + Math.random() * 5, 0, 7); x.fill();
    }
    noise(x, w, h, 12);
    return c;
  }
  // 卫浴深色石材
  function slateCanvas() {
    const w = 512, h = 512, c = cv(w, h), x = c.getContext('2d');
    x.fillStyle = '#3c4044'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 90; i++) {
      x.strokeStyle = `rgba(255,255,255,${0.015 + Math.random() * 0.05})`;
      x.lineWidth = .7 + Math.random() * 2;
      x.beginPath();
      let px = Math.random() * w, py = Math.random() * h; x.moveTo(px, py);
      for (let s = 0; s < 4; s++) { px += (Math.random() - .5) * 180; py += (Math.random() - .5) * 180; x.lineTo(px, py); }
      x.stroke();
    }
    noise(x, w, h, 14);
    return c;
  }
  // 织物（沙发／床品）
  function linenCanvas(r0, g0, b0) {
    const w = 256, h = 256, c = cv(w, h), x = c.getContext('2d');
    x.fillStyle = `rgb(${r0},${g0},${b0})`; x.fillRect(0, 0, w, h);
    for (let i = -h; i < w; i += 3) {
      x.strokeStyle = `rgba(255,255,255,.055)`; x.beginPath(); x.moveTo(i, 0); x.lineTo(i + h, h); x.stroke();
      x.strokeStyle = `rgba(0,0,0,.045)`; x.beginPath(); x.moveTo(i + 1.4, 0); x.lineTo(i + 1.4, h); x.stroke();
    }
    noise(x, w, h, 12);
    return c;
  }
  // 墙面：白灰泥，极淡的斑驳
  function plasterCanvas() {
    const w = 512, h = 512, c = cv(w, h), x = c.getContext('2d');
    x.fillStyle = '#edeae4'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 150; i++) {
      x.fillStyle = `rgba(${196 + Math.random() * 44},${194 + Math.random() * 42},${188 + Math.random() * 40},.09)`;
      x.beginPath(); x.arc(Math.random() * w, Math.random() * h, 8 + Math.random() * 34, 0, 7); x.fill();
    }
    noise(x, w, h, 5);
    return c;
  }
  // 天空渐变（同时作为环境反射）
  function skyCanvas() {
    const w = 1024, h = 512, c = cv(w, h), x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0.00, '#eaf2fb');
    g.addColorStop(0.42, '#f3f1ec');
    g.addColorStop(0.52, '#cfc9bf');
    g.addColorStop(1.00, '#9d968c');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    const s = x.createRadialGradient(w * .76, h * .18, 8, w * .76, h * .18, h * .55);
    s.addColorStop(0, 'rgba(255,244,222,.95)'); s.addColorStop(1, 'rgba(255,244,222,0)');
    x.fillStyle = s; x.fillRect(0, 0, w, h);
    return c;
  }

  const TEX = {
    wood: woodCanvas(), stone: stoneCanvas(), slate: slateCanvas(),
    sofa: linenCanvas(178, 172, 162), bed: linenCanvas(242, 240, 235),
    wall: plasterCanvas()
  };

  // 环境贴图（软反射，是"好看"的关键之一）
  const pmrem = new T.PMREMGenerator(renderer);
  const sky = tex(skyCanvas(), 1, 1);
  sky.mapping = T.EquirectangularReflectionMapping;
  const envRT = pmrem.fromEquirectangular(sky);
  scene.environment = envRT.texture;

  /* --------------------------------------------------------------- 材质库 */
  const M = {
    wall:   new T.MeshStandardMaterial({ map: tex(TEX.wall, 6, 3), color: 0xffffff, roughness: .95, metalness: 0, envMapIntensity: .55 }),
    wood:   new T.MeshStandardMaterial({ map: tex(TEX.wood, 1.4, 1.4), roughness: .58, metalness: 0, envMapIntensity: .5 }),
    slate:  new T.MeshStandardMaterial({ map: tex(TEX.slate, 2, 2), roughness: .42, metalness: .04, envMapIntensity: .7 }),
    stone:  new T.MeshStandardMaterial({ map: tex(TEX.stone, 1, 1), roughness: .88, metalness: 0, envMapIntensity: .45 }),
    oak:    new T.MeshStandardMaterial({ color: 0xbb8a58, roughness: .55, metalness: 0, envMapIntensity: .5 }),
    walnut: new T.MeshStandardMaterial({ color: 0x6a4a30, roughness: .48, metalness: 0, envMapIntensity: .55 }),
    dark:   new T.MeshStandardMaterial({ color: 0x33352f, roughness: .52, metalness: .06, envMapIntensity: .5 }),
    sofa:   new T.MeshStandardMaterial({ map: tex(TEX.sofa, 2, 2), color: 0xffffff, roughness: .95, metalness: 0, envMapIntensity: .4 }),
    bed:    new T.MeshStandardMaterial({ map: tex(TEX.bed, 2, 2), color: 0xffffff, roughness: .92, metalness: 0, envMapIntensity: .4 }),
    rug:    new T.MeshStandardMaterial({ map: tex(TEX.stone, 1, 1), color: 0xc6b8a2, roughness: .97, metalness: 0, envMapIntensity: .3 }),
    metal:  new T.MeshStandardMaterial({ color: 0x2b2b2b, roughness: .38, metalness: .72, envMapIntensity: .9 }),
    chrome: new T.MeshStandardMaterial({ color: 0xd7d9da, roughness: .22, metalness: .9, envMapIntensity: 1.1 }),
    ceramic:new T.MeshStandardMaterial({ color: 0xf7f7f4, roughness: .18, metalness: .02, envMapIntensity: .9 }),
    glass:  new T.MeshStandardMaterial({ color: 0xcfe0e8, roughness: .06, metalness: .02, transparent: true, opacity: .22, envMapIntensity: 1.4, side: T.DoubleSide }),
    leafA:  new T.MeshStandardMaterial({ color: 0x4c6a45, roughness: .85, metalness: 0 }),
    leafB:  new T.MeshStandardMaterial({ color: 0x5f7d51, roughness: .85, metalness: 0 }),
    soil:   new T.MeshStandardMaterial({ color: 0x3a3129, roughness: 1 }),
    paper:  new T.MeshStandardMaterial({ color: 0xf0ece4, roughness: .9 }),
    lamp:   new T.MeshStandardMaterial({ color: 0xfdf3e0, roughness: .5, emissive: 0x000000, emissiveIntensity: 0 })
  };

  // —— 暖化与软装色板：统一在这里覆盖/补充，方便一处调色
  M.oak.color.set(0xc08d5a);      M.oak.roughness = .52;
  M.walnut.color.set(0x6f4e34);   M.walnut.roughness = .45;
  M.sofa.color.set(0xefe6d8);     M.sofa.roughness = .97;
  M.bed.color.set(0xfaf6ee);
  M.rug.color.set(0xd9c6a7);
  M.wall.color.set(0xf7f2e9);
  M.leafA.color.set(0x51704a);    M.leafB.color.set(0x6b8a5c);
  M.lamp.emissive.set(0xffd9a0);  M.lamp.emissiveIntensity = .38;
  M.brass = new T.MeshStandardMaterial({ color: 0xc9a227, roughness: .34, metalness: .88, envMapIntensity: 1.0 });
  M.terra = new T.MeshStandardMaterial({ color: 0xb2603f, roughness: .9, metalness: 0 });
  M.mustard = new T.MeshStandardMaterial({ color: 0xc99a3f, roughness: .92, metalness: 0 });
  M.sage = new T.MeshStandardMaterial({ color: 0x8d9b83, roughness: .93, metalness: 0 });
  M.cream = new T.MeshStandardMaterial({ color: 0xefe7d9, roughness: .95, metalness: 0 });
  M.wood2 = new T.MeshStandardMaterial({ color: 0x9a6c46, roughness: .5, metalness: 0 });
  M.art = new T.MeshStandardMaterial({ color: 0xdcd2c2, roughness: .86, metalness: 0 });
  M.blanket = new T.MeshStandardMaterial({ color: 0xc3aa8d, roughness: .98, metalness: 0 });
  // 带图案的大地毯（照着真实模型里那张红调花纹毯做的）
  M.pattern = (function () {
    const c = cv(512, 512), x = c.getContext('2d');
    x.fillStyle = '#cbb99c'; x.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) {
      x.strokeStyle = 'rgba(150,70,50,.55)'; x.lineWidth = 3;
      x.strokeRect(20 + i * 82, 20 + j * 82, 62, 62);
      if ((i + j) % 2 === 0) { x.fillStyle = 'rgba(176,92,63,.32)'; x.fillRect(26 + i * 82, 26 + j * 82, 50, 50); }
    }
    for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) {
      x.fillStyle = 'rgba(232,222,204,.55)';
      x.beginPath(); x.arc(61 + i * 82, 61 + j * 82, 13, 0, 7); x.fill();
    }
    x.strokeStyle = 'rgba(120,60,44,.75)'; x.lineWidth = 11; x.strokeRect(5, 5, 502, 502);
    noise(x, 512, 512, 10);
    return new T.MeshStandardMaterial({ map: tex(c, 1, 1), roughness: .97, metalness: 0, envMapIntensity: .28 });
  })();

  /* ------------------------------------------------------------- 几何工具 */
  const boxGeoCache = {};
  function boxGeo(w, h, d) {
    const k = w.toFixed(3) + '_' + h.toFixed(3) + '_' + d.toFixed(3);
    return boxGeoCache[k] || (boxGeoCache[k] = new T.BoxGeometry(w, h, d));
  }
  function box(w, h, d, mat, x, y, z, parent) {
    const m = new T.Mesh(boxGeo(w, h, d), mat);
    m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true;
    (parent || scene).add(m);
    return m;
  }
  // 圆角感的软体（用两段盒子 + 收边近似）
  function softBox(w, h, d, mat, x, y, z, parent, r) {
    r = r === undefined ? .06 : r;
    const g = new T.Group();
    const body = box(w, h - r, d, mat, 0, -(r / 2), 0, g);
    const top = new T.Mesh(new T.BoxGeometry(w - r * 2, r, d - r * 2), mat);
    top.position.y = (h - r) / 2; top.castShadow = top.receiveShadow = true; g.add(top);
    g.position.set(x, y, z); (parent || scene).add(g);
    return g;
  }

  /* --------------------------------------------------------------- 建筑体 */
  const shell = new T.Group(); scene.add(shell);
  const roomsG = new T.Group(); scene.add(roomsG);
  const furnG = new T.Group(); scene.add(furnG);
  const gridG = new T.Group(); scene.add(gridG); gridG.visible = false;
  const labelG = new T.Group(); scene.add(labelG);
  let modelG = null;                       // 1:1 原始模型（在文件后段创建）

  // 楼层地面
  function floorPlate(r, mat, y) {
    const w = r.x2 - r.x1, d = r.z2 - r.z1;
    const g = box(w, .10, d, mat, r.cx + OX, (y || 0) - .05, r.cz + OZ, shell);
    g.castShadow = false;
    return g;
  }
  Object.keys(ROOMS).forEach(k => {
    const r = ROOMS[k];
    if (k === 'living') return;                       // L 形单独处理
    const bath = (k === 'bathA' || k === 'bathB' || k === 'wcC');
    floorPlate(r, bath ? M.slate : M.wood);
  });
  // L 形起居地面（两块）
  floorPlate(room(ROOMS.living.x1, ROOMS.living.z1, ROOMS.living.x2, 6.90), M.wood);
  floorPlate(room(7.60, 6.90, ROOMS.living.x2, ROOMS.living.z2), M.wood);
  floorPlate(ROOMS.study, M.wood);

  // 楼板（把屋子"托"起来，投影更实）
  const slab = box(W + .55, .34, D + .55, new T.MeshStandardMaterial({ color: 0xcfcac3, roughness: .9 }),
    OX + W / 2, -0.27, OZ + D / 2, shell);
  slab.castShadow = false;

  /* 墙体：中心线 + 洞口（a/b 为沿墙起点的距离，sill/head 为洞口上下沿） */
  const openings = [];   // 收集门窗，稍后生成框与玻璃
  const wallSpecs = [];  // 墙段规格，供剖切时重建
  const wallG = new T.Group(); shell.add(wallG);
  function wall(x1, z1, x2, z2, t, holes, opt) {
    opt = opt || {};
    const horiz = Math.abs(z2 - z1) < 1e-6;
    const len = horiz ? Math.abs(x2 - x1) : Math.abs(z2 - z1);
    const sx = horiz ? Math.sign(x2 - x1) || 1 : 0;
    const sz = horiz ? 0 : Math.sign(z2 - z1) || 1;
    const pieces = [];
    const hs = (holes || []).slice().sort((a, b) => a.a - b.a);
    let cur = 0;
    hs.forEach(h => { if (h.a > cur) pieces.push([cur, h.a, 0, WH]); cur = Math.max(cur, h.b); });
    if (cur < len) pieces.push([cur, len, 0, WH]);
    // 洞口上下的墙垛
    hs.forEach(h => {
      const sill = h.sill || 0, head = h.head === undefined ? 2.1 : h.head;
      if (sill > 0) pieces.push([h.a, h.b, 0, sill]);
      if (head < WH) pieces.push([h.a, h.b, head, WH]);
      openings.push({ horiz, x1, z1, x2, z2, t, a: h.a, b: h.b, sill, head, kind: h.kind || 'door' });
    });
    pieces.forEach(p => {
      const l = p[1] - p[0], h = p[3] - p[2];
      if (l <= 0.001 || h <= 0.001) return;
      const mid = (p[0] + p[1]) / 2;
      wallSpecs.push({
        w: horiz ? l : t, h: h, d: horiz ? t : l,
        x: (horiz ? x1 + sx * mid : x1) + OX,
        y0: p[2],
        z: (horiz ? z1 : z1 + sz * mid) + OZ,
        mat: opt.mat || M.wall
      });
    });
  }
  /* 按剖切高度重建墙体：只保留切面以下的部分 */
  function rebuildShell(cut) {
    wallG.clear();
    wallSpecs.forEach(s => {
      const h = Math.min(s.h, cut - s.y0);
      if (h <= 0.02) return;
      const m = new T.Mesh(boxGeo(s.w, h, s.d), s.mat);
      m.position.set(s.x, s.y0 + h / 2, s.z);
      m.castShadow = true; m.receiveShadow = true;
      wallG.add(m);
    });
    openings.forEach(o => { if (o.group) o.group.visible = (cut >= o.head - 0.02); });
  }

  const WIN = (a, b, sill, head) => ({ a, b, sill: sill === undefined ? 0.45 : sill, head: head === undefined ? 2.35 : head, kind: 'win' });
  const DOOR = (a, b, head) => ({ a, b, sill: 0, head: head === undefined ? 2.10 : head, kind: 'door' });
  const OPEN = (a, b, head) => ({ a, b, sill: 0, head: head === undefined ? 2.25 : head, kind: 'open' });

  // —— 外墙
  wall(0, 0, W, 0, EXT, [WIN(1.00, 3.30), WIN(5.10, 6.50, 1.70, 2.35), WIN(7.40, 8.80, 1.70, 2.35), WIN(10.20, 12.60)]);           // 北
  wall(0, D, W, D, EXT, [WIN(1.00, 3.60), WIN(5.20, 7.10), WIN(8.60, 12.70, 0.15, 2.40)]);                                          // 南
  wall(0, 0, 0, D, EXT, [WIN(1.00, 2.90), WIN(7.90, 9.70)]);                                                                        // 西
  wall(W, 0, W, D, EXT, [WIN(1.20, 3.40), DOOR(4.90, 6.70, 2.30), WIN(7.60, 9.90, 0.15, 2.40)]);                                     // 东（含入户门）

  // —— 内墙
  wall(4.60, 0, 4.60, 4.30, INT, [DOOR(3.35, 4.20)]);                       // 卧室A / 走廊
  wall(4.60, 3.00, 9.30, 3.00, INT, [DOOR(0.55, 1.45), DOOR(2.95, 3.85)]);  // 卫A·卫B / 走廊
  wall(7.00, 0, 7.00, 3.00, INT, []);                                       // 卫A / 卫B
  wall(9.30, 0, 9.30, 4.30, INT, [DOOR(3.35, 4.20)]);                       // 走廊 / 卧室B
  wall(0, 4.30, W, 4.30, INT, [OPEN(4.90, 6.60), DOOR(10.60, 11.50)]);      // 北排 / 南排（走廊→起居，卧室B→起居？实为衣帽开口）
  wall(2.30, 4.30, 2.30, 6.90, INT, [DOOR(1.30, 2.20)]);                    // 卫生间 / 西走廊
  wall(0, 6.90, 4.80, 6.90, INT, [DOOR(3.40, 4.30)]);                       // 西走廊 / 卧室C
  wall(4.80, 4.30, 4.80, 6.90, INT, [OPEN(0.35, 2.25)]);                    // 西走廊 / 起居（敞口）
  wall(4.80, 6.90, 4.80, D, INT, []);                                       // 卧室C / 书房
  wall(4.80, 6.90, 7.60, 6.90, INT, []);                                    // 书房北墙
  wall(7.60, 6.90, 7.60, D, INT, [DOOR(0.55, 2.05, 2.20)]);                 // 书房 / 起居（宽口）

  /* 门窗框 + 玻璃 + 门扇 */
  const frameMat = M.brass, leafMat = new T.MeshStandardMaterial({ color: 0x4a3423, roughness: .45, metalness: .04, envMapIntensity: .6 });
  openings.forEach(o => {
    const horiz = o.horiz, t = o.t;
    const mid = (o.a + o.b) / 2;
    const cx = horiz ? o.x1 + Math.sign(o.x2 - o.x1 || 1) * mid : o.x1;
    const cz = horiz ? o.z1 : o.z1 + Math.sign(o.z2 - o.z1 || 1) * mid;
    const len = o.b - o.a, hgt = o.head - o.sill;
    const g = new T.Group();
    g.position.set(cx + OX, 0, cz + OZ);
    if (!horiz) g.rotation.y = Math.PI / 2;
    const fw = .055, fd = t + .03;
    // 框
    const mk = (w, h, y, x) => { const m = new T.Mesh(boxGeo(w, h, fd), frameMat); m.position.set(x, y, 0); m.castShadow = true; g.add(m); };
    mk(len, fw, o.sill + fw / 2, 0); mk(len, fw, o.head - fw / 2, 0);
    mk(fw, hgt, o.sill + hgt / 2, -len / 2 + fw / 2); mk(fw, hgt, o.sill + hgt / 2, len / 2 - fw / 2);
    if (o.kind === 'win') {
      const gl = new T.Mesh(new T.PlaneGeometry(len - fw * 2, hgt - fw * 2), M.glass);
      gl.position.set(0, o.sill + hgt / 2, 0); g.add(gl);
      const vbar = new T.Mesh(boxGeo(fw * .7, hgt - fw * 2, fd * .7), frameMat);
      vbar.position.set(0, o.sill + hgt / 2, 0); g.add(vbar);          // 中挺
      // 窗台
      const sill = new T.Mesh(boxGeo(len + .12, .04, t + .22), M.wall);
      sill.position.set(0, o.sill - .02, 0); sill.castShadow = sill.receiveShadow = true; g.add(sill);
    } else if (o.kind === 'door') {
      // 半开的门扇
      const leaf = new T.Mesh(boxGeo(len - .06, hgt - .05, .04), leafMat);
      leaf.castShadow = leaf.receiveShadow = true;
      leaf.userData.blocker = true;                       // 开着的门扇也算遮挡物
      const pivot = new T.Group();
      pivot.position.set(-len / 2 + .03, o.sill, 0);
      leaf.position.set((len - .06) / 2 + .03, (hgt - .05) / 2 + .02, 0);
      pivot.add(leaf);
      pivot.rotation.y = -0.62;
      g.add(pivot);
      const knob = new T.Mesh(new T.SphereGeometry(.028, 12, 10), M.chrome);
      knob.position.set(len / 2 - .13, o.sill + 1.02, .045); g.add(knob);
    }
    o.group = g;
    shell.add(g);
  });

  /* 踢脚线 */
  function skirt(r) {
    const h = .075, t = .018, m = new T.MeshStandardMaterial({ color: 0xf6f4f0, roughness: .7 });
    const add = (w, d, x, z) => { const b = box(w, h, d, m, x, h / 2, z, shell); b.castShadow = false; };
    add(r.x2 - r.x1, t, r.cx + OX, r.z1 + OZ + t / 2);
    add(r.x2 - r.x1, t, r.cx + OX, r.z2 + OZ - t / 2);
    add(t, r.z2 - r.z1, r.x1 + OX + t / 2, r.cz + OZ);
    add(t, r.z2 - r.z1, r.x2 + OX - t / 2, r.cz + OZ);
  }

  /* ---------------------------------------------------------------- 家具 */
  function rug(x, z, w, d, y, parent, mat) {    const m = new T.Mesh(new T.BoxGeometry(w, .022, d), mat || M.rug);
    m.position.set(x + OX, (y || 0.012) + .011, z + OZ);
    m.receiveShadow = true; m.castShadow = false;
    (parent || furnG).add(m);
    // 软边：四周压条
    const edge = new T.Mesh(new T.BoxGeometry(w + .05, .012, d + .05), new T.MeshStandardMaterial({ color: 0xbfb4a4, roughness: .95 }));
    edge.position.set(x + OX, (y || 0.012) - .002, z + OZ); edge.receiveShadow = true;
    (parent || furnG).add(edge);
    return m;
  }
  // 床：床架 + 床垫 + 被子 + 枕头 + 床头板，rot = 0 床头朝西(-X)
  function bed(x, z, rot) {
    const g = new T.Group();
    g.position.set(x + OX, 0, z + OZ); g.rotation.y = rot || 0; furnG.add(g);
    const L = 2.10, Wd = 1.80, base = .30;
    box(Wd, base, L, M.oak, 0, base / 2, 0, g);                        // 床架
    softBox(Wd - .06, .26, L - .06, M.bed, 0, base + .13, 0, g, .07);   // 床垫
    box(Wd - .06, .10, L * .58, M.bed, 0, base + .30, L * .16, g);      // 被子
    const p1 = softBox(.62, .17, .38, M.bed, -.42, base + .34, -L / 2 + .30, g, .06);
    const p2 = softBox(.62, .17, .38, M.bed, .42, base + .34, -L / 2 + .30, g, .06);
    p1.rotation.x = p2.rotation.x = -.12;
    box(.09, 1.05, Wd + .12, M.walnut, -L / 2 + .02, .52, 0, g);        // 床头板
    // 床尾搭毯 + 装饰枕，让床不像"白板"
    const thr = box(Wd + .02, .07, .58, M.blanket, 0, base + .345, L / 2 - .44, g);
    thr.rotation.x = .015;
    const dc = softBox(.42, .13, .42, M.mustard, -.33, base + .40, L / 2 - .82, g, .04);
    dc.rotation.z = .10;
    const dc2 = softBox(.36, .12, .36, M.terra, .34, base + .39, L / 2 - .98, g, .04);
    dc2.rotation.z = -.12;
    return g;
  }
  function nightstand(x, z) {
    const g = new T.Group(); g.position.set(x + OX, 0, z + OZ); furnG.add(g);
    box(.46, .46, .40, M.walnut, 0, .23, 0, g);
    box(.40, .015, .34, M.dark, 0, .472, 0, g);
    const lampBase = box(.06, .16, .06, M.metal, 0, .55, 0, g);
    const shade = new T.Mesh(new T.CylinderGeometry(.11, .14, .17, 18, 1, true), M.lamp);
    shade.position.set(0, .70, 0); shade.castShadow = true; g.add(shade);
    return g;
  }
  function wardrobe(x, z, w, d, rot) {
    const g = new T.Group(); g.position.set(x + OX, 0, z + OZ); g.rotation.y = rot || 0; furnG.add(g);
    box(w, 2.35, d, M.walnut, 0, 1.175, 0, g);
    const n = Math.max(2, Math.round(w / .55));
    for (let i = 0; i < n; i++) {
      const dx = -w / 2 + w * (i + .5) / n;
      const p = box(w / n - .02, 2.24, .02, M.oak, dx, 1.175, d / 2 + .012, g);
      p.castShadow = false;
      const h = box(.02, .30, .02, M.chrome, dx + w / n / 2 - .06, 1.22, d / 2 + .03, g);
      h.castShadow = false;
    }
    return g;
  }
  function sofa(x, z, rot, len) {
    len = len || 2.20;
    const g = new T.Group(); g.position.set(x + OX, 0, z + OZ); g.rotation.y = rot || 0; furnG.add(g);
    const d = .92;
    box(len, .34, d, M.sofa, 0, .17, 0, g);                        // 座箱
    box(len, .62, .22, M.sofa, 0, .48, -d / 2 + .11, g);           // 靠背
    box(.22, .56, d, M.sofa, -len / 2 + .11, .45, 0, g);           // 扶手
    box(.22, .56, d, M.sofa, len / 2 - .11, .45, 0, g);
    const n = Math.round(len / .75);
    for (let i = 0; i < n; i++) {
      const cx = -len / 2 + len * (i + .5) / n;
      softBox(len / n - .06, .16, d - .26, M.sofa, cx, .42, .06, g, .05);
      const bc = softBox(len / n - .10, .40, .18, M.sofa, cx, .68, -d / 2 + .18, g, .05);
      bc.rotation.x = -.10;
    }
    // 抱枕
    [[-len / 2 + .42, 0x8d7f6b], [len / 2 - .42, 0x6f7a6a]].forEach(p => {
      const pil = softBox(.42, .42, .14, new T.MeshStandardMaterial({ color: p[1], roughness: .95 }), p[0], .58, -.14, g, .05);
      pil.rotation.z = .12; pil.rotation.x = -.28;
    });
    return g;
  }
  function armchair(x, z, rot) {
    const g = new T.Group(); g.position.set(x + OX, 0, z + OZ); g.rotation.y = rot || 0; furnG.add(g);
    const w = .78, d = .80;
    box(w, .34, d, M.sofa, 0, .17, 0, g);
    box(w, .52, .18, M.sofa, 0, .50, -d / 2 + .09, g);
    box(.14, .46, d, M.sofa, -w / 2 + .07, .42, 0, g);
    box(.14, .46, d, M.sofa, w / 2 - .07, .42, 0, g);
    softBox(w - .18, .14, d - .24, M.sofa, 0, .40, .04, g, .05);
    return g;
  }
  function coffeeTable(x, z) {
    const g = new T.Group(); g.position.set(x + OX, 0, z + OZ); furnG.add(g);
    box(1.15, .06, .62, M.walnut, 0, .40, 0, g);
    box(1.02, .04, .50, M.dark, 0, .12, 0, g);
    [[-.48, -.24], [.48, -.24], [-.48, .24], [.48, .24]].forEach(p => box(.05, .40, .05, M.metal, p[0], .20, p[1], g));
    // 桌上小物
    box(.22, .035, .16, M.paper, -.22, .445, 0, g);
    box(.14, .10, .14, new T.MeshStandardMaterial({ color: 0x7d3f3a, roughness: .6 }), .18, .47, .04, g);

  function tvWall(x, z, rot) {

    box(.06, .06, 1.5, M.metal, 0, .44, 0, g);
    box(.035, .92, 1.62, M.dark, 0, 1.32, .12, g);                  // 电视
    box(.02, .86, 1.56, new T.MeshStandardMaterial({ color: 0x11151a, roughness: .22, metalness: .3, emissive: 0x0b1016, emissiveIntensity: .6 }), 0, 1.32, .105, g);
    // 装饰
    box(.16, .30, .16, new T.MeshStandardMaterial({ color: 0x9a8f7e, roughness: .8 }), -.72, .57, 0, g);
    plant(.62, .10, .16, g, .55);
    return g;
  }
  function console(w, x, z, rot) {
    const g = new T.Group(); g.position.set(x + OX, 0, z + OZ); g.rotation.y = rot || 0; furnG.add(g);
    box(w, .12, .42, M.walnut, 0, .52, 0, g);
    [[-w / 2 + .08, 0], [w / 2 - .08, 0]].forEach(p => box(.06, .52, .36, M.metal, p[0], .26, p[1], g));
    box(.26, .03, .20, M.paper, -.3, .60, 0, g);
    return g;
  }
  function diningSet(x, z, rot) {
    const g = new T.Group(); g.position.set(x + OX, 0, z + OZ); g.rotation.y = rot || 0; furnG.add(g);
    const w = 1.70, d = .95;
    box(w, .055, d, M.oak, 0, .74, 0, g);
    [[-w / 2 + .12, -d / 2 + .12], [w / 2 - .12, -d / 2 + .12], [-w / 2 + .12, d / 2 - .12], [w / 2 - .12, d / 2 - .12]]
      .forEach(p => box(.07, .72, .07, M.walnut, p[0], .36, p[1], g));
    const chair = (cx, cz, r) => {
      const c = new T.Group(); c.position.set(cx, 0, cz); c.rotation.y = r; g.add(c);
      box(.46, .06, .46, M.sofa, 0, .44, 0, c);
      box(.46, .52, .07, M.sofa, 0, .70, -.20, c);
      [[-.19, -.19], [.19, -.19], [-.19, .19], [.19, .19]].forEach(p => box(.045, .44, .045, M.walnut, p[0], .22, p[1], c));
    };
    chair(-.45, -d / 2 - .32, 0); chair(.45, -d / 2 - .32, 0);
    chair(-.45, d / 2 + .32, Math.PI); chair(.45, d / 2 + .32, Math.PI);
    // 餐具
    [-.42, .42].forEach(dx => {
      const pl = new T.Mesh(new T.CylinderGeometry(.13, .13, .018, 22), M.ceramic);
      pl.position.set(dx, .78, -.22); pl.castShadow = true; g.add(pl);

  }
  function desk(x, z, rot) {
    const g = new T.Group(); g.position.set(x + OX, 0, z + OZ); g.rotation.y = rot || 0; furnG.add(g);
    box(1.55, .05, .70, M.oak, 0, .74, 0, g);

  }
  // 独立书架（靠墙摆放）
  function shelf(x, z, rot, w) {

  document.querySelectorAll('.sw').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.t;
      if (k === 'auto') ctrl.auto = !ctrl.auto; else state[k] = !state[k];
      applyState(); syncSwitches();
    };
  });
  function applyState() {
    const rebuild = state.mode !== 'model';
    shell.visible = rebuild;
    labelG.visible = state.labels && rebuild;
    furnG.visible = state.furniture && rebuild;
    gridG.visible = state.grid;
    if (modelG) modelG.visible = !rebuild;
    updateLegend();
  }
  syncSwitches(); applyState();

  const cut = document.getElementById('cut'), cutv = document.getElementById('cutv');
  function applyCut(v) {
    rebuildShell(v);
    state.cut = v;
    cutv.textContent = v.toFixed(2) + ' m';
  }
  cut.addEventListener('input', () => applyCut(parseFloat(cut.value)));

  const lg = document.getElementById('lights');
  const LIGHTS = {
    '日光': () => { scene.environment = envRT.texture; sun.intensity = 2.35; sun.color.set(0xfff0d8); sun.position.set(-9, 13, -11); hemi.intensity = .72; renderer.toneMappingExposure = 1.06; interior.visible = false; interiorLights.forEach(l => l.intensity = l.userData.base); scene.background.set(0xd9d6d1); },
    '黄昏': () => { scene.environment = envRT.texture; sun.intensity = 2.3; sun.color.set(0xffc07a); sun.position.set(-15, 4.5, -3); hemi.intensity = .40; renderer.toneMappingExposure = 1.04; interior.visible = true; interiorLights.forEach(l => l.intensity = l.userData.base * 0.8); scene.background.set(0xcfc3b4); },
    '夜晚': () => { scene.environment = null; sun.intensity = 0.04; sun.color.set(0x8fa8cc); sun.position.set(-6, 12, -9); hemi.intensity = .04; renderer.toneMappingExposure = 1.12; interior.visible = true; interiorLights.forEach(l => l.intensity = l.userData.base * 0.5); scene.background.set(0x22262c); }
  };
  Object.keys(LIGHTS).forEach((k, i) => {
    const b = document.createElement('button');
    b.textContent = k;
    if (i === 0) b.classList.add('on');
    b.onclick = () => {
      LIGHTS[k]();
      [].forEach.call(lg.children, c => c.classList.remove('on'));
      b.classList.add('on');
    };
    lg.appendChild(b);
  });

  /* ------------------------------------------------------------ 主循环 */
  function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  const clock = new T.Clock();
  function tick() {
    const dt = Math.min(clock.getDelta(), 0.05);
    if (ctrl.auto) { exitEye(); ctrl.dTheta += dt * 0.12; }

    ctrl.theta += (ctrl.dTheta - ctrl.theta) * Math.min(1, dt * 5.5);
    ctrl.phi += (ctrl.dPhi - ctrl.phi) * Math.min(1, dt * 5.5);
    ctrl.radius += (ctrl.dRadius - ctrl.radius) * Math.min(1, dt * 5.0);
    ctrl.target.lerp(ctrl.dTarget, Math.min(1, dt * 5.0));

    if (walk.on) {
      walkStep(dt);
      ctrl.dFov = 68;                               // 漫游用广角
    } else if (ctrl.dEye) {
      if (!ctrl.eye) ctrl.eye = camera.position.clone();
      ctrl.eye.lerp(ctrl.dEye, Math.min(1, dt * 3.4));
      camera.position.copy(ctrl.eye);
      camera.lookAt(ctrl.target);
    } else {
      const sp = Math.sin(ctrl.phi), r = ctrl.radius;
      camera.position.set(
        ctrl.target.x + r * sp * Math.sin(ctrl.theta),
        ctrl.target.y + r * Math.cos(ctrl.phi),
        ctrl.target.z + r * sp * Math.cos(ctrl.theta)
      );
      camera.lookAt(ctrl.target);
    }
    // 焦距平滑过渡（室内用广角，全景用标准镜头）
    if (Math.abs(camera.fov - ctrl.dFov) > 0.02) {
      camera.fov += (ctrl.dFov - camera.fov) * Math.min(1, dt * 4.2);
      camera.updateProjectionMatrix();
    }
    // 标注在室内视角会挡住画面：只在外部/平面视角显示
    labelG.visible = state.labels && state.mode !== 'model' && state.cut > 1.5 && !ctrl.dEye && !walk.on;
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  // 双击进入漫游
  dom.addEventListener('dblclick', () => { walk.on = true; enableWalk(); document.body.classList.add('walk'); });

  /* -------------------------------------------- 1:1 原始模型（glb，base64 内嵌） */
  // 说明：浏览器在 file:// 下不允许 fetch 本地 .glb，所以模型以普通 <script>
  // 注入 base64（assets/suite-model.js），这里自己解 GLB，不依赖 GLTFLoader。
  modelG = new T.Group(); modelG.visible = false; scene.add(modelG);
  let modelLoaded = false, modelInfo = null;
  const GCOMP = { 5120: Int8Array, 5121: Uint8Array, 5122: Int16Array, 5123: Uint16Array, 5125: Uint32Array, 5126: Float32Array };
  const GITEM = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4, MAT2: 4, MAT3: 9, MAT4: 16 };

  function b64buf(b64) {
    const s = atob(b64), n = s.length, u = new Uint8Array(n);
    for (let i = 0; i < n; i++) u[i] = s.charCodeAt(i);
    return u.buffer;
  }
  function parseGLB(buf) {
    const dv = new DataView(buf);
    if (dv.getUint32(0, true) !== 0x46546C67) throw new Error('不是 GLB 文件');
    let off = 12, json = null, bin = null;
    while (off + 8 <= buf.byteLength) {
      const len = dv.getUint32(off, true), type = dv.getUint32(off + 4, true);
      const chunk = buf.slice(off + 8, off + 8 + len);
      if (type === 0x4E4F534A) json = JSON.parse(new TextDecoder().decode(chunk));
      else if (type === 0x004E4942) bin = chunk;
      off += 8 + len;
    }
    return { json: json, bin: bin };
  }
  function accAttr(json, bin, idx) {
    const acc = json.accessors[idx], bv = json.bufferViews[acc.bufferView];
    const TA = GCOMP[acc.componentType], n = GITEM[acc.type], bpe = TA.BYTES_PER_ELEMENT;
    const base = (bv.byteOffset || 0) + (acc.byteOffset || 0);
    const stride = bv.byteStride || 0;
    if (!stride || stride === n * bpe) return new T.BufferAttribute(new TA(bin, base, acc.count * n), n);
    const out = new TA(acc.count * n);
    for (let i = 0; i < acc.count; i++) out.set(new TA(bin, base + i * stride, n), i * n);
    return new T.BufferAttribute(out, n);
  }
  function buildModelFromBuffer(buf, label) {
    const t0 = performance.now();
    while (modelG.children.length) modelG.remove(modelG.children[0]);
    try {
      const g = parseGLB(buf);
      const json = g.json, bin = g.bin;
      const texLoader = new T.TextureLoader(), texCache = {};
      function getTex(ti) {
        if (texCache[ti] !== undefined) return texCache[ti];
        let tex = null;
        try {
          const t = json.textures[ti], src = json.images[t.source];
          const bv = json.bufferViews[src.bufferView];
          const blob = new Blob([new Uint8Array(bin, bv.byteOffset || 0, bv.byteLength)], { type: src.mimeType || 'image/png' });
          tex = texLoader.load(URL.createObjectURL(blob));
          tex.flipY = false;                                  // glTF 约定
          tex.colorSpace = T.SRGBColorSpace;
          tex.wrapS = tex.wrapT = T.RepeatWrapping;
        } catch (e) { tex = null; }
        texCache[ti] = tex;
        return tex;
      }
      function matOf(mi) {
        const m = (json.materials || [])[mi] || {}, p = m.pbrMetallicRoughness || {};
        const c = p.baseColorFactor || [1, 1, 1, 1];
        const o = {
          color: new T.Color(c[0], c[1], c[2]),
          metalness: p.metallicFactor === undefined ? 0.05 : p.metallicFactor,
          roughness: p.roughnessFactor === undefined ? 0.70 : p.roughnessFactor,
          side: m.doubleSided ? T.DoubleSide : T.FrontSide,
          envMapIntensity: 0.72
        };
        const alpha = c[3] === undefined ? 1 : c[3];
        if (alpha < 0.98) {                 // 玻璃/透明材质：真透明，别再当深灰实心块
          o.transparent = true;
          o.opacity = Math.max(0.18, alpha);
          o.depthWrite = false;
          o.side = T.DoubleSide;
          o.roughness = Math.min(o.roughness, 0.25);
          o.metalness = 0.05;
        }
        if (p.baseColorTexture) { const t = getTex(p.baseColorTexture.index); if (t) o.map = t; }
        return new T.MeshStandardMaterial(o);
      }
      let tris = 0, meshCount = 0;
      function buildMesh(mi) {
        const mesh = json.meshes[mi], grp = new T.Group();
        grp.name = mesh.name || '';
        (mesh.primitives || []).forEach(pr => {
          const geo = new T.BufferGeometry(), at = pr.attributes || {};
          if (at.POSITION !== undefined) geo.setAttribute('position', accAttr(json, bin, at.POSITION));
          if (at.NORMAL !== undefined) geo.setAttribute('normal', accAttr(json, bin, at.NORMAL));
          if (at.TEXCOORD_0 !== undefined) geo.setAttribute('uv', accAttr(json, bin, at.TEXCOORD_0));
          if (pr.indices !== undefined) geo.setIndex(accAttr(json, bin, pr.indices));
          if (at.NORMAL === undefined) geo.computeVertexNormals();
          const pm = new T.Mesh(geo, matOf(pr.material));
          pm.castShadow = true; pm.receiveShadow = true;
          grp.add(pm); meshCount++;
          if (pr.indices !== undefined) tris += json.accessors[pr.indices].count / 3;
        });
        return grp;
      }
      function buildNode(ni) {
        const n = json.nodes[ni], o = new T.Group();
        o.name = n.name || '';
        if (n.matrix) o.applyMatrix4(new T.Matrix4().fromArray(n.matrix));
        else {
          if (n.translation) o.position.fromArray(n.translation);
          if (n.rotation) o.quaternion.fromArray(n.rotation);
          if (n.scale) o.scale.fromArray(n.scale);
        }
        if (n.mesh !== undefined) o.add(buildMesh(n.mesh));
        (n.children || []).forEach(c => o.add(buildNode(c)));
        return o;
      }
      const sc = json.scenes[json.scene || 0] || { nodes: [] };
      (sc.nodes || []).forEach(ni => modelG.add(buildNode(ni)));
      const bb = new T.Box3().setFromObject(modelG), size = bb.getSize(new T.Vector3());
      modelLoaded = true;
      modelInfo = {
        meshes: meshCount, tris: Math.round(tris),
        size: [+size.x.toFixed(2), +size.y.toFixed(2), +size.z.toFixed(2)],
        ms: Math.round(performance.now() - t0), source: label || 'glb'
      };
      // SketchUp 的 glTF 是 Y 向上、米制；模型自带原点不在场景中心，这里自动居中并落地
      const ctr = bb.getCenter(new T.Vector3());
      modelG.position.set(-ctr.x, -bb.min.y, -ctr.z);
      // 按真实模型尺度生成取景预设（我的重建场景与它尺寸不同，不能共用）
      const R = Math.max(size.x, size.z);
      VIEWS['模型总览'] = { t: [0, size.y * 0.35, 0], r: R * 1.30, th: Math.PI * 0.30, ph: Math.PI * 0.34 };
      VIEWS['模型平面'] = { t: [0, 0, 0], r: R * 1.12, th: Math.PI * 0.002, ph: 0.05 };
      VIEWS['模型鸟瞰'] = { t: [0, 0, 0], r: R * 1.20, th: Math.PI * 0.72, ph: Math.PI * 0.22 };
      ['模型总览', '模型平面', '模型鸟瞰'].forEach(function (k) {
        if (document.querySelector('button[data-v="' + k + '"]')) return;
        const b = document.createElement('button');
        b.textContent = '▸ ' + k;
        b.dataset.v = k;
        b.onclick = function () { flyTo(VIEWS[k]); };
        viewBar.appendChild(b);
      });
      try { window.console.log('1:1 模型已载入：', modelInfo); } catch (x) { }
    } catch (e) {
      var msg = String((e && e.message) || e);
      modelInfo = { error: msg };
      try { window.console.error('模型载入失败', e); } catch (x) { }
      const el = document.getElementById('legendInfo');
      if (el) el.textContent = '1:1 模型解析失败：' + msg + '（请把这句话发给我）';
    }
    updateLegend();
  }

  function setModelMode() {
    state.mode = 'model';
    const bar = document.getElementById('models');
    [].forEach.call(bar.children, c => c.classList.toggle('on', c.textContent.indexOf('原始模型') === 0));
    applyState();
    if (VIEWS['模型总览']) flyTo(VIEWS['模型总览']);   // 自动框住真实模型
  }
  function loadRawModel(autoSwitch) {
    if (window.SUITE_GLB_B64) { buildModelFromBuffer(b64buf(window.SUITE_GLB_B64), '内嵌 glb'); if (autoSwitch) setModelMode(); return; }
    // file:// 下 fetch 会被拦；用本地服务器（http）打开时走这条，零点击
    fetch('assets/suite-1to1.glb').then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.arrayBuffer();
    }).then(function (buf) {
      buildModelFromBuffer(buf, 'assets/suite-1to1.glb');
      if (autoSwitch) setModelMode(); else applyState();
    }).catch(function (e) {
      modelInfo = null;
      const el = document.getElementById('legendInfo');
      if (el) el.textContent = '未能自动读取 glb（' + e.message + '）——请点「载入 glb…」选择 suite-3d/assets/suite-1to1.glb';
    });
  }
  // 兜底：直接选本机的 .glb 载入（file:// 下不能用 fetch，但 FileReader 可以）
  const glbInput = document.createElement('input');
  glbInput.type = 'file'; glbInput.accept = '.glb,.gltf'; glbInput.style.display = 'none';
  document.body.appendChild(glbInput);
  glbInput.onchange = function () {
    const f = glbInput.files && glbInput.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = function () {
      modelLoaded = false;
      buildModelFromBuffer(fr.result, f.name);
      setModelMode();
    };
    fr.readAsArrayBuffer(f);
  };
  function loadModelFile(file) {
    const fr = new FileReader();
    fr.onload = function () { modelLoaded = false; buildModelFromBuffer(fr.result, file.name); state.mode = 'model'; applyState(); };
    fr.readAsArrayBuffer(file);
  }

  function updateLegend() {
    const el = document.getElementById('legendInfo');
    if (!el) return;
    if (state.mode !== 'model') { el.textContent = '程序化材质与光照 · 单位：米 · 参考 套房.skp 重建'; return; }
    if (!modelInfo) { el.textContent = '1:1 原始模型载入中 …'; return; }
    if (modelInfo.error) { el.textContent = '1:1 模型不可用：' + modelInfo.error; return; }
    el.textContent = '1:1 原始模型（' + (modelInfo.source || 'glb') + '）· ' + modelInfo.tris.toLocaleString() +
      ' 三角面 · ' + modelInfo.size.join(' × ') + ' m';
  }

  /* ------------------------------------------------------------ 模型模式 */
  const MODE_BTNS = {
    '重建场景': function () { state.mode = 'rebuild'; },
    '原始模型 1:1': function () {
      if (modelLoaded) { setModelMode(); return false; }
      loadRawModel(true);
      return false;
    },
    '载入 glb…': function () { glbInput.click(); return false; }
  };
  const modelBar = document.getElementById('models');
  Object.keys(MODE_BTNS).forEach((k, i) => {
    const b = document.createElement('button');
    b.textContent = k;
    if (i === 0) b.classList.add('on');
    b.onclick = () => {
      const r = MODE_BTNS[k]();
      if (r === false) return;
      [].forEach.call(modelBar.children, c => c.classList.remove('on'));
      b.classList.add('on');
      applyState(); updateLegend();
    };
    modelBar.appendChild(b);
  });

  // 供外部自动化截图调用（不影响交互使用）
  window.SUITE = {
    views: VIEWS, flyTo: flyTo, lights: LIGHTS, state: state,
    applyState: applyState, camera: camera, renderer: renderer, scene: scene,
    cut: function (v) { cut.value = v; applyCut(v); },
    mode: function (m) {
      const btn = [].filter.call(modelBar.children, b => b.textContent.indexOf(m) === 0)[0];
      if (btn) btn.click();
      return state.mode;
    },
    modelInfo: function () { return modelInfo; }
  };

  /* ---------- 沙发原地旋转（以物体自身中心为轴；group 原点就是它的中心） ---------- */
  (function () {
    const st = { obj: null, base: 0, target: 0, t: 0, dur: 1, on: false };
    function spinTo(obj, deg, dur) {
      if (!obj) return false;
      st.obj = obj;
      st.base = obj.rotation.y;
      st.target = st.base + (deg === undefined ? 360 : deg) * Math.PI / 180;
      st.t = 0;
      st.dur = dur === undefined ? 4 : dur;
      st.on = true;
      return true;
    }
    let last = performance.now();
    (function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.05); last = now;
      if (st.on && st.obj) {
        st.t += dt;
        const k = Math.min(1, st.t / Math.max(0.01, st.dur));
        const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;   // 缓入缓出
        st.obj.rotation.y = st.base + (st.target - st.base) * e;
        if (k >= 1) st.on = false;
      }
      requestAnimationFrame(loop);
    })(last);
    // 面板上加一个按钮（放在「显示」那一组的末尾）
    const rows = document.querySelector('.panel .rows');
    if (rows) {
      const r = document.createElement('div'); r.className = 'row';
      const lab = document.createElement('span'); lab.textContent = '沙发原地旋转';
      const btn = document.createElement('button'); btn.textContent = '转一圈';
      btn.onclick = function () { spinTo(livingSofa, 360, 4.2); };
      r.appendChild(lab); r.appendChild(btn); rows.appendChild(r);
    }
    if (window.SUITE) {
      window.SUITE.spinSofa = function (deg, dur) { return spinTo(livingSofa, deg, dur); };
      window.SUITE.sofa = livingSofa;
      window.SUITE.person = grandma;
    }
    // 「人物」开关
    const rows2 = document.querySelector('.panel .rows');
    if (rows2 && window.SUITE) {
      const r2 = document.createElement('div'); r2.className = 'row';
      const l2 = document.createElement('span'); l2.textContent = '人物（70 岁女性）';
      const b2 = document.createElement('button'); b2.className = 'sw on';
      b2.onclick = function () {
        peopleG.visible = !peopleG.visible;
        b2.classList.toggle('on', peopleG.visible);
      };
      r2.appendChild(l2); r2.appendChild(b2); rows2.appendChild(r2);
      window.SUITE.togglePerson = function (v) {
        peopleG.visible = (v === undefined) ? !peopleG.visible : !!v;
        b2.classList.toggle('on', peopleG.visible);
        return peopleG.visible;
      };
      const r3 = document.createElement('div'); r3.className = 'row';
      const l3 = document.createElement('span'); l3.textContent = '送药机器人';
      const b3 = document.createElement('button'); b3.className = 'sw on';
      b3.onclick = function () {
        robotG.visible = !robotG.visible;
        b3.classList.toggle('on', robotG.visible);
      };
      r3.appendChild(l3); r3.appendChild(b3); rows2.appendChild(r3);
      window.SUITE.robot = careRobot;
      window.SUITE.toggleRobot = function (v) {
        robotG.visible = (v === undefined) ? !robotG.visible : !!v;
        b3.classList.toggle('on', robotG.visible);
        return robotG.visible;
      };
    }
  })();

  applyCut(WH);
  renderer.compile(scene, camera);
  tick();
  setTimeout(() => document.getElementById('boot').classList.add('off'), 260);
})();
</script>
</body>
</html>
